name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=git-
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  promote:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_TAG: git-${{ github.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          repository: nirojasmar/beacon-argo-gitops
          ref: main
          token: ${{ secrets.GITOPS_PAT }}

      - name: Promote the newly built image tag into the GitOps overlay
        shell: bash
        run: |
          file="overlays/oci/kustomization.yaml"

          if [[ ! -f "$file" ]]; then
            echo "Manifest not found: $file" >&2
            exit 1
          fi

          tag_count="$(grep -Ec '^[[:space:]]*newTag:' "$file" || true)"
          if [[ "$tag_count" -ne 1 ]]; then
            echo "Expected exactly one newTag field in $file; found $tag_count" >&2
            exit 1
          fi

          sed -i -E \
            "s/^([[:space:]]*newTag:[[:space:]]*).*/\1${IMAGE_TAG}/" \
            "$file"

          grep -qE \
            "^[[:space:]]*newTag:[[:space:]]*${IMAGE_TAG}[[:space:]]*$" \
            "$file"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$file"

          if git diff --cached --quiet; then
            echo "Image tag is already up to date."
            exit 0
          fi

          git commit -m "chore: promote image tag to ${IMAGE_TAG}"
          git push origin HEAD:main
